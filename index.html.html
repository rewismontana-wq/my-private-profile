<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .loading-box { text-align: center; }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; border-radius: 18px; }
        .text { font-size: 18px; font-weight: bold; }
        /* Animasi berkedip */
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="loading-box">
    <img id="logo-img" class="logo" src="" alt="icon" onerror="this.style.display='none'">
    <div id="theme-text" class="text">Connecting...</div>
    <p class="blink" style="font-size: 12px; color: #aaa;">Please wait a moment</p>
</div>

<script>
    // 1. DAFTAR TEMA (IKON & TEKS)
    const themes = [
        { name: "WhatsApp", icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png", text: "Opening WhatsApp Chat...", color: "#075E54" },
        { name: "TikTok", icon: "https://cdn-icons-png.flaticon.com/512/3046/3046121.png", text: "Opening TikTok Video...", color: "#010101" },
        { name: "Tinder", icon: "https://cdn-icons-png.flaticon.com/512/2504/2504943.png", text: "Finding Your Match...", color: "#FD297B" },
        { name: "OnlyFans", icon: "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/onlyfans.svg", text: "Loading Private Content...", color: "#00aff0" }
    ];

    // 2. PILIH RANDOM
    const pick = themes[Math.floor(Math.random() * themes.length)];

    // Terapkan ke Tampilan
    document.getElementById("logo-img").src = pick.icon;
    document.getElementById("theme-text").innerText = pick.text;
    document.body.style.backgroundColor = pick.color;

    // 3. LINK TRAFEE KAMU (GANTI DI SINI)
    const linkTrafee = "https://cgiaaag.clickssm.com/s/133baad435f7a?track=unlocked&subsource=unlocked&ext_click_id=unlocked";

    // Redirect setelah 2 detik
    setTimeout(function() {
        window.location.href = linkTrafee;
    }, 2000);
</script>

</body>
</html>
